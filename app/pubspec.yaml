name: uninav
description: "UniNav — data-driven indoor navigation platform. Venue knowledge lives in data, never in code."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  # Floor raised from 3.22.0, which was never true. The app already uses APIs
  # introduced after it, and a 3.22 SDK cannot compile this code:
  #   RadioGroup<T>                           settings_screen.dart   (3.32)
  #   DropdownButtonFormField(initialValue:)  route_planner_screen   (3.32)
  #   Matrix4.translateByDouble/scaleByDouble map_screen.dart        (3.29)
  # Keep this honest: a declared floor nobody builds against is worse than
  # none, because CI silently drifts away from it.
  flutter: ">=3.32.0"

# No Firebase dependencies yet — the data layer runs on a bundled-asset data
# source, and Firebase plugs into the same repository interfaces whenever it
# lands (see docs/14-roadmap.md).
dependencies:
  collection: ^1.18.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  meta: ^1.12.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # Whole-directory entries so a newly generated bundle_<ID>.json is picked
    # up without editing pubspec every time a building gets mapped.
    - assets/campuses/vit-vellore/
    - assets/campuses/demo/
