# Gradle daemon heap. 4G is ample for this project (one app module plus a few
# Flutter plugins); the previous 8G/4G-metaspace setting was simply excessive.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# The Kotlin compile daemon is a separate JVM and inherits org.gradle.jvmargs
# when this is unset. Bounding it explicitly keeps two JVMs from each
# reserving the full Gradle heap. Hygiene, not a bug fix.
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m

# ---------------------------------------------------------------------------
# REQUIRED on this machine: the project lives on D:\ and the pub cache lives on
# C:\Users\Astryx\AppData\Local\Pub\Cache.
#
# Kotlin's incremental compiler persists source paths relative to the project
# directory (RelocatableFileToPathConverter -> File.relativeTo). On Windows
# there is no relative path between two drive letters, so compiling any plugin
# whose sources sit on C: throws:
#
#   IllegalArgumentException: this and base files have different roots:
#     C:\...\shared_preferences_android-2.4.27\...\*.kt and D:\...\app\android
#
# which surfaces as "Could not close incremental caches" and then
# "Daemon compilation failed" on :shared_preferences_android:compileDebugKotlin.
#
# Disabling incremental compilation bypasses that cache layer entirely. The
# cost is small here: Flutter plugin modules are tiny and rarely change, and
# Gradle still skips up-to-date tasks.
#
# The durable alternative is to put the pub cache on the same drive as the
# project (set PUB_CACHE to a D:\ path) — see docs/15-known-issues.md. Once
# that is done, this line can be removed to get incremental builds back.
kotlin.incremental=false
# ---------------------------------------------------------------------------

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
